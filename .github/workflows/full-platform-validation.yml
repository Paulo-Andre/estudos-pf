name: Full platform validation

on:
  pull_request:
    branches: [main]

jobs:
  node-platform:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: estudos_pf_node
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3307/estudos_pf_node
      ROOT_INITIAL_PASSWORD: CI-Root-Password-2026!
      JWT_SECRET: ci-cookie-secret-long-enough-for-tests
      MERCADO_PAGO_WEBHOOK_SECRET: ci-mercado-pago-webhook-secret
      RESEND_API_KEY: re_ci_placeholder_only
      RESEND_FROM_EMAIL: Núcleo Concursos <onboarding@resend.dev>
      PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Prepare disposable Node MySQL schema
        run: pnpm exec drizzle-kit push --force
      - name: Seed local ROOT and default catalog
        run: pnpm exec tsx scripts/ci-seed-node.ts
      - name: Tests without live external credentials
        run: >
          pnpm exec vitest run
          --exclude server/mercado-pago.credentials.test.ts
          --exclude server/resend.credentials.test.ts
          --exclude server/commerce.integration.test.ts
      - name: Production build
        run: pnpm run build

  django:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: estudos_pf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/estudos_pf
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall -q backend
      - name: Django check
        working-directory: backend
        run: python manage.py check
      - name: Migration drift
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Tests
        working-directory: backend
        run: python manage.py test --verbosity 2
