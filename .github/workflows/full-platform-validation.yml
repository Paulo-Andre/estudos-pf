name: Full platform validation

on:
  pull_request:
    branches: [main]

jobs:
  node-platform:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: estudos_pf_node
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3307/estudos_pf_node
      ROOT_INITIAL_PASSWORD: CI-Root-Password-2026!
      JWT_SECRET: ci-cookie-secret-long-enough-for-tests
      MERCADO_PAGO_ACCESS_TOKEN: TEST-ci-placeholder
      MERCADO_PAGO_WEBHOOK_SECRET: ci-mercado-pago-webhook-secret
      RESEND_API_KEY: re_ci_placeholder_only
      RESEND_FROM_EMAIL: Núcleo Concursos <onboarding@resend.dev>
      PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Assert REST adapter coverage
        run: node scripts/assert-rest-adapter-coverage.mjs
      - name: Export protected study seed
        run: pnpm exec tsx scripts/export-protected-study-seed.ts tmp/protected-study-seed.json
      - name: Upload protected study seed
        uses: actions/upload-artifact@v4
        with:
          name: protected-study-seed
          path: tmp/protected-study-seed.json
          if-no-files-found: error
          retention-days: 1
      - name: Prepare disposable Node MySQL schema
        run: pnpm exec drizzle-kit push --force
      - name: Seed local ROOT and default catalog
        run: pnpm exec tsx scripts/ci-seed-node.ts
      - name: Tests without live external credentials
        run: >
          pnpm exec vitest run
          --exclude server/mercado-pago.credentials.test.ts
          --exclude server/resend.credentials.test.ts
          --exclude server/commerce.integration.test.ts
      - name: Production build
        run: pnpm run build
      - name: Assert protected content is absent from browser bundle
        run: node scripts/assert-no-protected-content-in-build.mjs

  django:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: estudos_pf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/estudos_pf
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall -q backend
      - name: Django check
        working-directory: backend
        run: python manage.py check
      - name: Migration drift
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Tests
        working-directory: backend
        run: python manage.py test --verbosity 2

  protected-data-migration:
    needs: node-platform
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: estudos_pf_migration
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: ci-migration-secret-key
      DATABASE_URL: mysql://root:root@127.0.0.1:3308/estudos_pf_migration
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: protected-study-seed
          path: tmp
      - name: Install Django dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Create migration administrator without a usable password
        working-directory: backend
        run: python manage.py shell -c "from django.contrib.auth import get_user_model; U=get_user_model(); u,_=U.objects.get_or_create(username='ci-root',defaults={'email':'ci-root@example.invalid','is_staff':True,'is_superuser':True}); u.set_unusable_password(); u.save()"
      - name: Dry-run protected data import
        working-directory: backend
        run: python manage.py import_protected_study_seed ../tmp/protected-study-seed.json --admin-username ci-root --dry-run
      - name: Import protected data
        working-directory: backend
        run: python manage.py import_protected_study_seed ../tmp/protected-study-seed.json --admin-username ci-root
      - name: Re-run import to prove idempotency
        working-directory: backend
        run: python manage.py import_protected_study_seed ../tmp/protected-study-seed.json --admin-username ci-root
      - name: Assert imported protected catalog
        working-directory: backend
        run: python manage.py shell -c "from courses.models import CourseContent; from knowledge.models import Question; assert CourseContent.objects.filter(is_published=True).exists(); assert Question.objects.filter(legacy_key__isnull=False).exists(); print('Protected data migration verified')"

  legacy-core-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: estudos_pf_legacy
        ports:
          - 3310:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3310/estudos_pf_legacy
      ROOT_INITIAL_PASSWORD: CI-Root-Password-2026!
      DEBUG: "1"
      DJANGO_SECRET_KEY: ci-legacy-migration-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Create legacy Drizzle schema
        run: pnpm exec drizzle-kit push --force
      - name: Seed legacy ROOT
        run: pnpm exec tsx scripts/ci-seed-node.ts
      - name: Seed representative legacy data
        run: pnpm exec tsx scripts/ci-seed-legacy-migration.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Django dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Create Django schema alongside legacy tables
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Dry-run legacy import
        working-directory: backend
        run: python manage.py import_legacy_core --dry-run --strict
      - name: Import legacy core
        working-directory: backend
        run: python manage.py import_legacy_core --strict
      - name: Re-run legacy import to prove idempotency
        working-directory: backend
        run: python manage.py import_legacy_core --strict
      - name: Assert migrated legacy state and password upgrade
        working-directory: backend
        run: python manage.py shell < ../scripts/assert-legacy-migration.py
