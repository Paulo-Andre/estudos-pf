name: Django validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: estudos_pf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/estudos_pf
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Check migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Run Django tests
        working-directory: backend
        run: python manage.py test --verbosity 2
