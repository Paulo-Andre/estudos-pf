services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: estudos_pf_laboratorio
      MYSQL_USER: estudos_pf
      MYSQL_PASSWORD: estudos_pf_local
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "3307:3306"
    volumes:
      - estudos-pf-laboratorio-db:/var/lib/mysql
      - ./drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_local_only",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  estudos-pf-laboratorio-db:
