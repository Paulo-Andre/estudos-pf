# Render Blueprint: import this repository in Render to create the Web Service.
# Secrets and account-specific URLs deliberately remain unset here; add them in
# the Render dashboard after the service has been created.
services:
  - type: web
    name: nucleo-concursos
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run check && pnpm run test && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ROOT_INITIAL_PASSWORD
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
